spring:
  application:
    name: agriculture-knowledge-api

  profiles:
    # Applies only when nothing else is active, so local work needs no flags while
    # Railway still wins by setting SPRING_PROFILES_ACTIVE=prod.
    default: local

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate may only check that it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Gmail SMTP. Leave host and username unset and the application still starts —
  # codes go to the log instead of the inbox, which is what local work wants.
  # The password must be a Google App Password, not the account password.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # Two ways to reach Gmail: 587 with STARTTLS, or 465 with implicit SSL.
          # Configurable because some hosts block one port and not the other, and
          # finding out which is a matter of trying rather than reading docs.
          ssl:
            enable: ${MAIL_SSL_ENABLE:false}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: ${MAIL_STARTTLS_ENABLE:true}
          # Without these a dead SMTP host hangs the request thread until the OS
          # gives up, which on a sign-up form looks like the site has frozen.
          # 5s proved too tight for a cold TLS handshake across regions.
          connectiontimeout: ${MAIL_TIMEOUT_MS:15000}
          timeout: ${MAIL_TIMEOUT_MS:15000}
          writetimeout: ${MAIL_TIMEOUT_MS:15000}

  # Google sign-in is deliberately not declared here. Spring Boot builds the
  # client registration from properties alone, so setting GOOGLE_CLIENT_ID and
  # GOOGLE_CLIENT_SECRET (see README) switches it on, and leaving them unset
  # keeps the application starting cleanly without a half-configured provider.

server:
  # Railway injects PORT. Without this the container starts, listens on the wrong
  # port, fails its health check and gets killed — the classic first-deploy failure.
  port: ${PORT:8080}
  shutdown: graceful

app:
  version: @project.version@
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  # Comma-separated. Used for Vercel preview deployments, which each get their own URL.
  extra-allowed-origins: ${APP_EXTRA_ALLOWED_ORIGINS:}

  # Comma-separated emails promoted to ADMIN on startup. The account must already
  # exist — sign up first, then restart. There is no public route to becoming admin.
  bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:}

  # Keyed by IP. Generous by default because this audience is often behind one
  # shared connection; tighten per deployment if you know your traffic.
  rate-limit:
    login-attempts: ${APP_RATE_LIMIT_LOGIN_ATTEMPTS:15}
    login-window: ${APP_RATE_LIMIT_LOGIN_WINDOW:PT5M}
    registrations: ${APP_RATE_LIMIT_REGISTRATIONS:25}
    registration-window: ${APP_RATE_LIMIT_REGISTRATION_WINDOW:PT1H}

  # How transactional email leaves.
  #
  # Brevo's HTTP API is preferred because Railway blocks outbound SMTP: both 587
  # and 465 time out at the connection stage there, while the same container
  # reaches Postgres and the wider internet fine. An HTTPS call on 443 is not
  # blocked anywhere. SMTP below still works locally and on hosts that allow it.
  mail:
    brevo-api-key: ${BREVO_API_KEY:}
    from: ${MAIL_FROM:}
    from-name: ${MAIL_FROM_NAME:Agriculture Knowledge}

  jwt:
    # Base64-encoded, at least 32 bytes. Generate with: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:}
    issuer: agriculture-knowledge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-name: ak_refresh
    # Frontend and API are on different sites in production, which forces
    # SameSite=None; browsers then require Secure. localhost counts as a secure
    # context, so this works over plain http during development too.
    refresh-cookie-same-site: ${APP_REFRESH_COOKIE_SAME_SITE:None}
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.agriknowledge: DEBUG
