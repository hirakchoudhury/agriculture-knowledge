spring:
  application:
    name: agriculture-knowledge-api

  profiles:
    # Applies only when nothing else is active, so local work needs no flags while
    # Railway still wins by setting SPRING_PROFILES_ACTIVE=prod.
    default: local

  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate may only check that it matches.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Google sign-in is deliberately not declared here. Spring Boot builds the
  # client registration from properties alone, so setting GOOGLE_CLIENT_ID and
  # GOOGLE_CLIENT_SECRET (see README) switches it on, and leaving them unset
  # keeps the application starting cleanly without a half-configured provider.

server:
  # Railway injects PORT. Without this the container starts, listens on the wrong
  # port, fails its health check and gets killed — the classic first-deploy failure.
  port: ${PORT:8080}
  shutdown: graceful

app:
  version: @project.version@
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  # Comma-separated. Used for Vercel preview deployments, which each get their own URL.
  extra-allowed-origins: ${APP_EXTRA_ALLOWED_ORIGINS:}

  # Comma-separated emails promoted to ADMIN on startup. The account must already
  # exist — sign up first, then restart. There is no public route to becoming admin.
  bootstrap-admin-emails: ${APP_BOOTSTRAP_ADMIN_EMAILS:}

  jwt:
    # Base64-encoded, at least 32 bytes. Generate with: openssl rand -base64 32
    secret: ${APP_JWT_SECRET:}
    issuer: agriculture-knowledge
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    refresh-cookie-name: ak_refresh
    # Frontend and API are on different sites in production, which forces
    # SameSite=None; browsers then require Secure. localhost counts as a secure
    # context, so this works over plain http during development too.
    refresh-cookie-same-site: ${APP_REFRESH_COOKIE_SAME_SITE:None}
    refresh-cookie-secure: ${APP_REFRESH_COOKIE_SECURE:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  level:
    root: INFO
    com.agriknowledge: DEBUG
